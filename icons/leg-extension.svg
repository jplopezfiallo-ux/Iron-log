<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="16" fill="#1e293b"/>
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- seated figure, side view -->
    <circle cx="35" cy="25" r="6" fill="#38bdf8" stroke="none"/>
    <line x1="35" y1="31" x2="35" y2="55"/>
    <!-- seat -->
    <line x1="20" y1="55" x2="35" y2="55"/>
    <line x1="20" y1="55" x2="20" y2="85"/>
    <!-- thigh -->
    <line x1="35" y1="55" x2="55" y2="55"/>
    <!-- lower leg extending to pad -->
    <line x1="55" y1="55" x2="60" y2="80"/>
    <!-- pad + arm -->
    <line x1="60" y1="80" x2="60" y2="60"/>
    <line x1="60" y1="60" x2="80" y2="52"/>
  </g>
</svg>
