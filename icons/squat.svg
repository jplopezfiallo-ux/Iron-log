<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="16" fill="#1e293b"/>
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- squatting figure, side view -->
    <circle cx="50" cy="26" r="6" fill="#38bdf8" stroke="none"/>
    <line x1="50" y1="32" x2="50" y2="55"/>
    <!-- bent legs -->
    <line x1="50" y1="55" x2="35" y2="65"/>
    <line x1="35" y1="65" x2="40" y2="88"/>
    <line x1="50" y1="55" x2="62" y2="65"/>
    <line x1="62" y1="65" x2="58" y2="88"/>
    <!-- barbell across shoulders -->
    <line x1="30" y1="34" x2="70" y2="34"/>
    <rect x="24" y="27" width="8" height="14" rx="2" fill="#38bdf8" stroke="none"/>
    <rect x="68" y="27" width="8" height="14" rx="2" fill="#38bdf8" stroke="none"/>
  </g>
</svg>
