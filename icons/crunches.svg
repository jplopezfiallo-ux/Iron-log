<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="16" fill="#1e293b"/>
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- lying figure curling up, side view -->
    <line x1="18" y1="68" x2="42" y2="68"/>
    <!-- bent knees -->
    <line x1="42" y1="68" x2="50" y2="52"/>
    <line x1="50" y1="52" x2="66" y2="58"/>
    <!-- torso curling up -->
    <circle cx="30" cy="48" r="6" fill="#38bdf8" stroke="none"/>
    <path d="M35 52 Q28 60 30 68" stroke-dasharray="0"/>
    <!-- arms crossed near chest -->
    <line x1="30" y1="54" x2="40" y2="56"/>
  </g>
</svg>
