<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="16" fill="#1e293b"/>
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- prone figure, side view -->
    <circle cx="25" cy="45" r="6" fill="#38bdf8" stroke="none"/>
    <line x1="30" y1="48" x2="55" y2="48"/>
    <!-- bench -->
    <line x1="20" y1="55" x2="60" y2="55"/>
    <line x1="24" y1="55" x2="24" y2="65"/>
    <line x1="56" y1="55" x2="56" y2="65"/>
    <!-- leg curling up to pad -->
    <line x1="55" y1="48" x2="72" y2="50"/>
    <line x1="72" y1="50" x2="78" y2="30"/>
    <!-- pad/arm -->
    <line x1="78" y1="30" x2="78" y2="50"/>
  </g>
</svg>
