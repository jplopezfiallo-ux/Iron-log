<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="100" height="100" rx="16" fill="#1e293b"/>
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- angled preacher pad -->
    <line x1="30" y1="60" x2="55" y2="45"/>
    <line x1="30" y1="70" x2="55" y2="55"/>
    <!-- seat -->
    <line x1="35" y1="70" x2="35" y2="85"/>
