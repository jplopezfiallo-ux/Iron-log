<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="16" fill="#1e293b"/>
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- seated figure, front view -->
    <circle cx="50" cy="24" r="6" fill="#38bdf8" stroke="none"/>
    <line x1="50" y1="30" x2="50" y2="55"/>
    <line x1="40" y1="38" x2="60" y2="38"/>
    <!-- seat -->
    <line x1="40" y1="60" x2="60" y2="60"/>
    <!-- legs pushing pads outward (arcs) -->
    <path d="M50 62 Q30 62 22 50"/>
    <path d="M50 62 Q70 62 78 50"/>
    <!-- pads -->
    <line x1="20" y1="40" x2="20" y2="58"/>
    <line x1="80" y1="40" x2="80" y2="58"/>
